<!DOCTYPE html>
<html lang="ru" data-theme="noir">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>WaveTogether — слушайте музыку вместе</title>
  <meta name="description" content="Платформа для совместного прослушивания музыки в реальном времени: личные комнаты для пар, волны настроения, общая волна, плейлисты и глубокая кастомизация в духе Winamp.">
  <!-- Инлайн-SVG фавиконка: сердце с волной -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%238b7cf6' d='M12 21s-8-5.3-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.7-8 11-8 11z'/%3E%3Cpath fill='%23fff' d='M7 10.6h1.6l.9-1.8 1.3 3.6 1-2.4.5.6h2.6v1.4h-3.3l-.6-.9-1 2.3-1.4-3.8-.8 1.4H7z'/%3E%3C/svg%3E">

  <!-- Шрифты (при отсутствии сети gracefully деградируют до системных) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/themes.css">

  <script>
    /* Мгновенное применение темы ДО загрузки основного JS, чтобы не было «вспышки»
       дефолтной темы. Полный набор настроек применит customization.js после входа. */
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('wt_last_settings') || 'null');
        if (!s) return;
        var r = document.documentElement;
        if (s.theme) r.dataset.theme = s.theme;
        if (s.font) r.dataset.font = s.font;
        if (s.accent) r.style.setProperty('--accent', s.accent);
        if (s.chatSide) r.dataset.chatSide = s.chatSide;
        if (s.playerPos) r.dataset.playerPos = s.playerPos;
      } catch (e) { /* молча игнорируем — применится дефолт */ }
    })();
  </script>
</head>
<body>
  <!-- Фоновый слой (градиенты / изображения / анимированные фоны из галереи) -->
  <div id="bg-layer" aria-hidden="true"></div>
  <!-- Канвас летающих частиц (сердечки/ноты) -->
  <canvas id="fx-particles" aria-hidden="true"></canvas>

  <!-- Корень SPA: сюда роутер рендерит экраны -->
  <div id="app"></div>

  <!-- Глобальный док-плеер (бар / виджет / плавающий / полноэкранный) -->
  <div id="player-dock" class="dock dock--bar" hidden></div>

  <!-- Панель кастомизации (drawer) -->
  <div id="custom-scrim" hidden></div>
  <aside id="custom-drawer" hidden></aside>

  <!-- Скрытый держатель для iframe SoundCloud Widget API -->
  <div id="sc-holder" aria-hidden="true"></div>

  <!-- Всплывающие уведомления -->
  <div id="toast-root" aria-live="polite"></div>
  <!-- Модальные окна -->
  <div id="modal-root"></div>

  <noscript>
    <div style="padding:40px;text-align:center;font-family:sans-serif">
      WaveTogether — интерактивное приложение. Пожалуйста, включите JavaScript.
    </div>
  </noscript>

  <!-- Чистый vanilla JS, без фреймворков. 6 файлов, порядок важен. -->
  <script src="js/utils.js"></script>
  <script src="js/player.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/social.js"></script>
  <script src="js/customization.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
